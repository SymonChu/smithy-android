[versions]
# ═══════════ 引擎层：版本已核实（2026-10 实测仓库元数据）═══════════
arsclib        = "V1.4.0"    # jitpack  com.github.REAndroid:ARSCLib
jadxAndroid    = "1.4.7"     # jitpack  com.github.MuntashirAkon.jadx:jadx-core / jadx-dex-input
apksigAndroid  = "4.4.0"     # jitpack  com.github.MuntashirAkon:apksig-android
smali          = "3.0.10"    # google-maven  com.android.tools.smali:smali / smali-baksmali

# ═══════════ 以下全部标 VERIFY：建工程时用 Android Studio 模板值 / 查最新，勿盲抄 ═══════════
agp            = "8.7.0"     # VERIFY
kotlin         = "2.0.20"    # VERIFY  kotlin 与 compose 编译器插件版本必须一致
ksp            = "2.0.20-1.0.25"  # VERIFY  必须与 kotlin 版本匹配
composeBom     = "2024.09.00"     # VERIFY
navigation     = "2.8.0"     # VERIFY
activityCompose= "1.9.2"     # VERIFY
bouncycastle   = "1.78.1"    # VERIFY  org.bouncycastle:bcprov-jdk15to18 / bcpkix-jdk15to18
simplemagic    = "1.17"      # VERIFY  com.j256.simplemagic:simplemagic
zstd           = "1.5.6-6"   # VERIFY  com.github.luben:zstd-jni (@aar)
shizuku        = "13.1.5"    # VERIFY  dev.rikka.shizuku:api / :provider
libsu          = "5.2.2"     # VERIFY  com.github.topjohnwu.libsu:core
hiddenapibypass= "4.1"       # VERIFY  org.lsposed.hiddenapibypass:hiddenapibypass
soraEditor     = "0.23.6"    # VERIFY  io.github.Rosemoe.sora-editor（LGPL-2.1，仅以未修改库形式引用）
okhttp         = "4.12.0"    # VERIFY
room           = "2.6.1"     # VERIFY
aboutlibraries = "11.2.3"    # VERIFY  com.mikepenz:aboutlibraries-compose-m3
coroutines     = "1.8.1"     # VERIFY
serialization  = "1.7.1"     # VERIFY

[libraries]
# ── APK 引擎 ──
arsclib          = { module = "com.github.REAndroid:ARSCLib", version.ref = "arsclib" }
jadx-core        = { module = "com.github.MuntashirAkon.jadx:jadx-core", version.ref = "jadxAndroid" }
jadx-dex-input   = { module = "com.github.MuntashirAkon.jadx:jadx-dex-input", version.ref = "jadxAndroid" }
apksig-android   = { module = "com.github.MuntashirAkon:apksig-android", version.ref = "apksigAndroid" }
smali            = { module = "com.android.tools.smali:smali", version.ref = "smali" }
smali-baksmali   = { module = "com.android.tools.smali:smali-baksmali", version.ref = "smali" }
bouncycastle     = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-pkix= { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncycastle" }
simplemagic      = { module = "com.j256.simplemagic:simplemagic", version.ref = "simplemagic" }
zstd             = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }

# ── Android 平台能力 ──
shizuku-api      = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
libsu            = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
hiddenapibypass  = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }

# ── 编辑器（LGPL-2.1，仅以未修改库形式引用，许可页声明）──
sora-editor      = { module = "io.github.Rosemoe.sora-editor:editor", version.ref = "soraEditor" }
sora-textmate    = { module = "io.github.Rosemoe.sora-editor:language-textmate", version.ref = "soraEditor" }

# ── UI ──
androidx-compose-bom      = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui       = { module = "androidx.compose.ui:ui" }
androidx-compose-material3= { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
aboutlibraries   = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }

# ── 基础设施 ──
coroutines-core   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android= { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json= { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp            = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse        = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
room-runtime      = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx          = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler     = { module = "androidx.room:room-compiler", version.ref = "room" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
