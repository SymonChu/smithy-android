name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：它会执行 `sdkmanager tools`，
      # 而新版 sdkmanager（16.0）已移除 tools 包，直接报 "Failed to find package 'tools'"。
      # runner 本来就预装了 Android SDK，这里只补我们需要的组件。
      - name: Android SDK 组件
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKM"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # 顺序有讲究：先构建出 APK，再拿它当样本跑集成测试 —— 用自己构建的产物验证解析器。
      # 必须传绝对路径：测试 JVM 的工作目录是模块目录，相对路径会找不到文件而静默跳过。
      - name: 构建 debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 引擎测试（纯逻辑 + 真实 APK 集成）
        run: |
          SMITHY_TEST_APK="$PWD/app/build/outputs/apk/debug/app-debug.apk" \
            ./gradlew :core:engine:testDebugUnitTest --stacktrace

      # 图标集是脚本生成的，编译通过说明不了画出来是不是空的（少一层平移就是
      # 一片空白、还不报错），所以这一条必须跑
      - name: 设计系统测试（图标集结构）
        run: ./gradlew :core:design:testDebugUnitTest --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: smithy-debug
          path: app/build/outputs/apk/debug/*.apk
