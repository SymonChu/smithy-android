name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：它会执行 `sdkmanager tools`，
      # 而新版 sdkmanager（16.0）已移除 tools 包，直接报 "Failed to find package 'tools'"。
      # runner 本来就预装了 Android SDK，这里只补我们需要的组件。
      - name: Android SDK 组件
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKM"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 引擎单元测试
        run: ./gradlew :core:engine:testDebugUnitTest --stacktrace

      - name: 构建 debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: smithy-debug
          path: app/build/outputs/apk/debug/*.apk
